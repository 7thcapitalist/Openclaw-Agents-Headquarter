# The release gate cites "tests pass" as evidence. Until this workflow existed
# nothing verified that claim: `npm run test:factory` had not terminated since
# #56 — it hung rather than failed, so it produced no result at all, and every
# green claim for fifteen merged PRs reported something nobody could observe
# (docs/software-factory/handoffs/2026-09-09-reliability-overhaul.md, item 2).
#
# This runs on every PR into main and on main itself, so a red merge is caught
# by the repository rather than by the next person to run the suite by hand.
name: factory tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded run on the same PR is wasted signal; keep only the newest.
concurrency:
  group: factory-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: factory test suite
    runs-on: ubuntu-latest
    # The suite's own wall-clock bound is 600s (scripts/run-factory-tests.mjs).
    # This is the outer net for anything that hangs before the runner starts.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/backend/package-lock.json

      # The repository root declares no dependencies and has no lockfile, so
      # there is nothing to install there. `dashboard/backend` does, and its
      # absence is not harmless: the CSRF, CSP, session and stored-XSS tests
      # SKIP themselves when those deps are missing rather than fail, so
      # without this step CI reported green while 14 security tests never ran.
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard/backend --no-audit --no-fund

      - name: Verify third-party provenance
        run: npm run check:provenance

      # `test:factory` is bounded twice over (per-test and whole-suite), so a
      # hang becomes a failure with a legible message instead of a 6-hour job.
      #
      # The run is captured once and inspected afterwards rather than executed
      # twice — the suite takes most of this job's wall clock.
      #
      # A skip is not a pass. The browser-hardening tests degrade to `test.skip`
      # when their dependencies are missing, which is right for a developer who
      # has not run `npm run setup`, and wrong to let CI report as success. If
      # anything skipped here, the install step above is not doing its job.
      - name: Run factory test suite
        run: |
          set -o pipefail
          npm run test:factory 2>&1 | tee /tmp/factory-tests.log
          skipped="$(grep -oE '^. skipped [0-9]+' /tmp/factory-tests.log | grep -oE '[0-9]+' | head -1)"
          echo "skipped: ${skipped:-0}"
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::${skipped} test(s) were skipped in CI; the browser-hardening suite must run here."
            exit 1
          fi
