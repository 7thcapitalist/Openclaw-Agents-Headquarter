<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenClaw Startup HQ</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <div class="brand-title">OpenClaw Startup HQ</div>
          <div class="brand-sub">Control plane</div>
        </div>
      </div>
      <span class="freshness" id="freshness" hidden></span>
      <button type="button" class="btn-ghost" id="refresh" hidden>Refresh</button>
      <button type="button" class="btn-ghost" id="sign-out" hidden>Sign out</button>
    </header>

    <main class="page">
      <!-- Sign in. The server is the authority; this is only which view to draw. -->
      <section class="shell-state" id="signin" hidden>
        <span class="eyebrow">Headquarters</span>
        <h1>Sign in.</h1>
        <p>
          This control plane mirrors company state. It is not public, and it
          holds no factory controls the local dashboard does not already have.
        </p>
        <form id="signin-form" autocomplete="on">
          <label class="field-label" for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          <p class="signin-error" id="signin-error" hidden></p>
          <button type="submit" class="btn-primary" id="signin-submit">Sign in</button>
        </form>
      </section>

      <!-- Anything that is not a rendered mirror: empty, offline, unreadable. -->
      <section class="shell-state" id="state" hidden>
        <span class="eyebrow" id="state-eyebrow"></span>
        <h1 id="state-title"></h1>
        <p id="state-body"></p>
      </section>

      <!-- The mirror itself. -->
      <div id="mirror" hidden>
        <nav class="tabs" id="tabs"></nav>
        <!-- Home, and the tabs that share its vocabulary. -->
        <section class="home" id="home"></section>
        <section class="view" id="view" hidden></section>

        <details class="everything-else">
          <summary>Everything else</summary>
          <div class="stale-banner" id="stale-banner" hidden></div>
          <section class="stat-row" id="stats"></section>
          <div class="panel-grid" id="panels"></div>
        </details>
      </div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
